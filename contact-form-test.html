<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Acme Co. — Contact Us (test page)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  section { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
  section h2 { margin-top: 0; font-size: 1rem; color: #555; }
  label { display: block; margin: 10px 0 4px; font-size: 0.85rem; font-weight: 600; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 8px; font-size: 0.9rem; border: 1px solid #ccc; border-radius: 4px; }
  button { margin-top: 14px; padding: 10px 18px; font-size: 0.9rem; background: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  .config { background: #fafafa; }
  .visitor { background: #fff; }
  pre { background: #111; color: #d4f4d4; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 0.8rem; white-space: pre-wrap; }
  .hint { font-size: 0.75rem; color: #888; margin-top: 2px; }
  .ok { color: #0a7a2f; }
  .err { color: #c02626; }
</style>
</head>
<body>

<section class="config">
  <h2>Test harness config (not part of the real site — fill in your account's real values)</h2>
  <label for="apiUrl">API URL</label>
  <input id="apiUrl" value="https://l2ej48431a.execute-api.us-east-1.amazonaws.com/dev/v1/send" />

  <label for="apiKey">API key</label>
  <input id="apiKey" type="password" autocomplete="off" placeholder="paste your key here" />

  <label for="fromEmail">from (a verified domain on your account)</label>
  <input id="fromEmail" placeholder="no-reply@yourdomain.com" />

  <label for="toEmail">to (your own inbox, where the enquiry should land)</label>
  <input id="toEmail" placeholder="you@yourdomain.com" />

  <label for="templateId">template_id (must have name / email / message variables)</label>
  <input id="templateId" placeholder="contact_form" />
</section>

<hr />

<h1>Acme Co.</h1>
<p>Have a question? Send us a message and we'll get back to you.</p>

<section class="visitor">
  <h2>This part is what an actual visitor sees on your website</h2>
  <form id="contactForm">
    <label for="visitorName">Name</label>
    <input id="visitorName" required />

    <label for="visitorEmail">Your email</label>
    <input id="visitorEmail" type="email" required />
    <p class="hint">Sent as reply_to — this is the part being tested.</p>

    <label for="visitorMessage">Message</label>
    <textarea id="visitorMessage" rows="4" required></textarea>

    <button type="submit" id="submitBtn">Send</button>
  </form>
</section>

<div id="result"></div>

<script>
const form = document.getElementById("contactForm");
const resultEl = document.getElementById("result");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  submitBtn.disabled = true;
  submitBtn.textContent = "Sending...";
  resultEl.innerHTML = "";

  const payload = {
    from: document.getElementById("fromEmail").value.trim(),
    to: document.getElementById("toEmail").value.trim(),
    reply_to: document.getElementById("visitorEmail").value.trim(),
    template_id: document.getElementById("templateId").value.trim(),
    template_params: {
      name: document.getElementById("visitorName").value.trim(),
      email: document.getElementById("visitorEmail").value.trim(),
      message: document.getElementById("visitorMessage").value.trim(),
    },
  };

  const apiUrl = document.getElementById("apiUrl").value.trim();
  const apiKey = document.getElementById("apiKey").value.trim();

  try {
    const res = await fetch(apiUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": apiKey },
      body: JSON.stringify(payload),
    });
    const body = await res.json();
    resultEl.innerHTML = `
      <p class="${res.ok ? "ok" : "err"}"><strong>${res.status}</strong> ${res.ok ? "queued" : "rejected"}</p>
      <p>Request sent:</p>
      <pre>${JSON.stringify(payload, null, 2)}</pre>
      <p>Response:</p>
      <pre>${JSON.stringify(body, null, 2)}</pre>
    `;
  } catch (err) {
    resultEl.innerHTML = `<p class="err">Network error: ${err.message}</p>`;
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Send";
  }
});
</script>

</body>
</html>
